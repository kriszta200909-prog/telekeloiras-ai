name: TelekEloiras regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy
      - name: Live OENY Kondoros 1570 diagnostic
        env:
          STREAMLIT_SERVER_HEADLESS: 'true'
        run: |
          python - <<'PY'
          import json, urllib.error, urllib.parse, urllib.request
          from app import resolve_settlement_code, public_parcel_geometry, HRSZ_API_BASE, normalize_hrsz
          from shapely.geometry import shape
          def probe(label,url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TelekEloirasAI/15.16','Accept':'application/json','Referer':'https://www.oeny.hu/'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      body=response.read()
                      typ=response.headers.get('Content-Type','unknown').split(';')[0]
                      print(label,'HTTP',response.status,'content-type',typ,'bytes',len(body))
                      if 'json' not in typ: print(label,'unexpected-content-type')
                      return json.loads(body)
              except urllib.error.HTTPError as exc:
                  print(label,'HTTP',exc.code,'content-type',exc.headers.get('Content-Type','unknown').split(';')[0],'error',str(exc.reason)[:200])
              except Exception as exc:
                  print(label,'HTTP none','error-type',type(exc).__name__,'error',str(exc)[:240])
              return None
          base=HRSZ_API_BASE.rsplit('/parcels',1)[0]
          probe('settlement',base+'/settlements/search?'+urllib.parse.urlencode({'searchString':'Kondoros'}))
          try:
              ksh=resolve_settlement_code('Kondoros')
              print('settlement exact match verified:',bool(ksh))
              query=urllib.parse.urlencode({'kshCode':ksh,'lotNumber':normalize_hrsz('1570')})
              from app import _find_parcel_record
              rows=probe('search',HRSZ_API_BASE+'/search?'+query)
              record=_find_parcel_record(rows,'1570') if rows is not None else None
              parcel_id=next((str(record[key]) for key in ('id','parcelId','parcel_id','objectId','objectID') if record and record.get(key) not in (None,'')),'')
              if parcel_id:
                  print('exact parcel record id present:',True)
                  geo=probe('bounding-box',HRSZ_API_BASE+'/bounding-box?'+urllib.parse.urlencode({'id':parcel_id}))
                  if isinstance(geo,dict):
                      outline=geo.get('outline')
                      print('outline type:',outline.get('type') if isinstance(outline,dict) else type(outline).__name__)
                      if isinstance(outline,dict) and outline.get('type') in ('Polygon','MultiPolygon'):
                          g=shape(outline)
                          print('geometry valid:',g.is_valid,'area in source units:',round(g.area,3),'bounds:',tuple(round(x,2) for x in g.bounds))
              else: print('bounding-box SKIPPED: no exact parcel id')
              try:
                  result=public_parcel_geometry(ksh,'1570')
                  print('public_parcel_geometry SUCCESS; geometry_role:',result.get('geometry_role'),'crs:',result.get('geometry_crs'))
              except Exception as exc:
                  print('public_parcel_geometry FAILED',type(exc).__name__,str(exc)[:240])
          except Exception as exc:
              print('chain FAILED',type(exc).__name__,str(exc)[:240])
          PY
      - name: Syntax check
        run: python -m compileall -q app.py plan_labels.py plan_localization.py plan_ocr_worker.py rule_inventory.py test_plan_labels.py test_plan_localization.py test_rule_inventory.py test_parcel_zones.py geopdf.py plan_legend.py plan_connections.py plan_geometry_audit.py zone_parameters.py gis_sources.py visual_plan.py test_visual_plan.py reference_checks.py test_gis_sources.py test_automatic_sources.py test_plan_legend.py test_zone_evidence.py test_plan_geometry_audit.py
      - name: Unit and regression tests
        env:
          STREAMLIT_SERVER_HEADLESS: 'true'
        run: python -m unittest discover -v

  kondoros-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing pipeline dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hun
          python -m pip install -r requirements.txt numpy
      - name: Run actual Kondoros 1570 official-source pipeline
        env:
          STREAMLIT_SERVER_HEADLESS: 'true'
        run: |
          mkdir -p work
          timeout --signal=TERM --kill-after=15s 1500s python -u reference_checks.py --case-index 7 --resume-attempts 1 --visual-images work --output work/kondoros-1570.json
      - name: Diagnose full pipeline from actual result JSON
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('work/kondoros-1570.json')
          if not p.exists():
              print('ENGINE OUTPUT MISSING');raise SystemExit(0)
          rows=json.loads(p.read_text()).get('cases',[])
          for row in rows:
              for key in ('errors','plan_inputs','plan_result','visual','identification','classification','zone_rules','label_search','label_hits'):
                  value=row.get(key,{})
                  if key=='plan_inputs':
                      value={k:v for k,v in value.items() if k in ('source_url','edition','source_valid','current_verified','source_selection_ambiguous','error','source_warning','attachments')}
                      if 'attachments' in value:value['attachments']=[{'name':x.get('Megnevezés'),'url':x.get('URL')} for x in value['attachments'][:8]]
                  elif key=='visual':
                      value={k:v for k,v in value.items() if k in ('status','zone','reasons','candidate_labels','intersection_verified','source_zone_features','source_regulatory_lines','illustration_file')}
                      for name in ('source_zone_features','source_regulatory_lines'):
                          if name in value:value[name+'_count']=len(value.pop(name))
                  elif key=='plan_result':
                      value={k:v for k,v in value.items() if k in ('zone','candidate_zone','detail','registrations','hrsz_method','parcel_boundary_verified','zone_features')}
                      if 'zone_features' in value:value['zone_features_count']=len(value.pop('zone_features'))
                  elif key=='zone_rules':
                      value={k:v for k,v in value.items() if k in ('status','zone','error','reason','rules','applicable')}
                      if 'rules' in value:value['rules_count']=len(value.pop('rules')) if isinstance(value['rules'],list) else 'not-list'
                  print('PIPELINE',key,json.dumps(value,ensure_ascii=False,default=str)[:4500])
          PY
      - name: Preserve original engine output and evidence map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kondoros-1570-engine-evidence
          path: |
            work/kondoros-1570.json
            work/kondoros-1570.png
          if-no-files-found: warn

  live-six-parcel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-hun
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy
      - name: Run all six parcels against live official sources
        env:
          STREAMLIT_SERVER_HEADLESS: 'true'
        run: |
          mkdir -p work
          for i in 1 2 3 4 5 6 7; do
            echo "::group::Official-source parcel $i of 7"
            timeout --signal=TERM --kill-after=15s 600s python -u reference_checks.py --case-index "$i" --resume-attempts 1 --output "work/parcel-$i.json" || echo "Parcel $i incomplete (timeout or source error); no automatic match asserted." | tee "work/parcel-$i.error.txt"
            echo "::endgroup::"
          done
      - name: Preserve actual source-backed results, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-parcel-live-results
          path: work/parcel-*.json\n            work/parcel-*.error.txt
          if-no-files-found: warn
