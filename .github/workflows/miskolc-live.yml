name: Official Miskolc PDF integration
on:
  workflow_dispatch:
  push:
    paths:
      - test_miskolc_live.py
      - .github/workflows/miskolc-live.yml
jobs:
  check-official-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pymupdf numpy pillow
      - name: Check real NJT Miskolc plan page 31
        run: python test_miskolc_live.py
